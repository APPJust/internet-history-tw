<section class="panel" aria-label="封包繞道實驗室">
<h2>互動：封包繞道實驗室</h2>
<p>點一下線路可讓它「斷線」（再點一次修復），然後按「送出封包」，看看封包從「起點」能不能抵達「終點」、走哪條路。試著切斷所有通往終點的線，想想馬祖斷纜時發生了什麼。</p>
<svg id="lab" viewBox="0 0 900 380" role="group" aria-label="可點擊的網路圖"></svg>
<div class="labbtns"><button id="send">送出封包</button><button id="isolate">切斷所有通往終點的線</button><button id="addbackup">加上一條衛星備援線</button><button id="resetlab">全部修復</button></div>
<p id="feedback" role="status">所有線路正常。按「送出封包」試試看。</p>
</section>
<p class="note">畫面中的網路、地圖與島嶼為示意圖，非實際比例或真實路由；速度比較為標稱速率換算，非實測。來源列於 project.json 與 sources.md。鍵盤：空白鍵播放／暫停，← → 前後 5 秒。</p>

<script>
// Every visible state is a pure function of (frame, narration locale, subtitle language, caption toggle).
// Scene animation is keyed to each locale's measured sentence anchors, so zh/en narration stay in sync.
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search);
const exporting=params.get('export')==='1';if(exporting)document.body.classList.add('export');
const SUBS=['en-US','vi-VN','ja-JP'];
let project,frame=0,locale=params.get('locale')||'zh-TW',subs=SUBS.includes(params.get('captions'))?params.get('captions'):'en-US',playing=false,
 captionOn=!exporting||SUBS.includes(params.get('captions')),last=0,audio=new Audio(),audioReady=false;
const clamp=x=>Math.min(1,Math.max(0,x)),ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.6;x=clamp(x);return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,p)=>a+(b-a)*p;
const C={ink:'#2a2622',paper:'#f5eedf',paper2:'#ebe0c6',red:'#c4432f',teal:'#1d6b73',mustard:'#d89a2b',blue:'#3d6f9e',gray:'#857b69',green:'#3f7d4a',sea:'#9fbcc2',sea2:'#86a9b0'};
const CH=['','第 1 章 · 起源','第 2 章 · 原理','第 3 章 · 比較','第 4 章 · 應用案例','第 5 章 · 展望'];
// --- tiny SVG helpers ---------------------------------------------------------------
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function G(inner,{x=0,y=0,r=0,s=1,o=1,id=''}={}){if(o<=0.001)return '';return `<g${id?` id="${id}" class="qa"`:''} transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${r.toFixed(2)}) scale(${s.toFixed(3)})" opacity="${o.toFixed(3)}">${inner}</g>`}
function Tx(x,y,s,size=30,{fill=C.ink,anchor='middle',weight=700,ls=0,italic=false}={}){return `<text x="${x}" y="${y}" font-size="${size}" fill="${fill}" text-anchor="${anchor}" font-weight="${weight}"${ls?` letter-spacing="${ls}"`:''}${italic?' font-style="italic"':''} dominant-baseline="middle">${esc(s)}</text>`}
function Paper(w,h,{fill=C.paper,tape=true,tapeX=0,shadow=true}={}){return `<rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="${fill}"${shadow?' filter="url(#shadow)"':''}/><rect x="${-w/2}" y="${-h/2}" width="${w}" height="${h}" fill="${fill}" filter="url(#grainf)" opacity=".55"/>`+(tape?`<rect x="${tapeX-45}" y="${-h/2-15}" width="90" height="28" fill="#f1df95" opacity=".78" transform="rotate(-4 ${tapeX} ${-h/2})"/>`:'')}
function Stamp(s,{size=34,color=C.red,w=null}={}){const W=w||s.length*size*1.05+40;return `<rect x="${-W/2}" y="${-size*.9}" width="${W}" height="${size*1.8}" fill="none" stroke="${color}" stroke-width="5" rx="6"/>`+Tx(0,2,s,size,{fill:color,weight:900,ls:2})}
function Line(x1,y1,x2,y2,p=1,{stroke=C.ink,w=4,dash=''}={}){const x=lerp(x1,x2,p),y=lerp(y1,y2,p);return p<=0?'':`<line x1="${x1}" y1="${y1}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round"${dash?` stroke-dasharray="${dash}"`:''}/>`}
function Pin(label,sub,{color=C.red,anchor='start',dx=22}={}){return `<path d="M0 0 C-14 -20 -16 -30 -16 -36 A16 16 0 1 1 16 -36 C16 -30 14 -20 0 0z" fill="${color}" filter="url(#shadow)"/><circle cy="-36" r="6" fill="${C.paper}"/>`+Tx(anchor==='start'?dx:-dx,-44,label,30,{anchor,weight:900})+(sub?Tx(anchor==='start'?dx:-dx,-10,sub,24,{anchor,weight:600,fill:'#4b4134'}):'')}
function polyAt(pts,p){let L=0;const seg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d}let r=clamp(p)*L;for(let i=0;i<seg.length;i++){if(r<=seg[i]||i===seg.length-1){const q=seg[i]?Math.min(1,r/seg[i]):0;return[lerp(pts[i][0],pts[i+1][0],q),lerp(pts[i][1],pts[i+1][1],q)]}r-=seg[i]}return pts.at(-1)}
const kk=(t,a,d=.6)=>ease(clamp((t-a)/d));
const pop=(t,a,d=.45)=>{const p=clamp((t-a)/d);return{o:clamp(p*1.6),s:.82+.18*back(p)}};
function Slip(ch,n,{tag=true,c=C.mustard}={}){return `<rect x="-34" y="-34" width="68" height="68" fill="${C.paper}" stroke="${c}" stroke-width="4" filter="url(#shadow)"/>`+Tx(0,-4,ch,36,{weight:900})+(tag?`<rect x="-34" y="20" width="68" height="22" fill="${c}"/>`+Tx(0,31,'#'+n+' →終點',17,{fill:'#fff',weight:700}):'')}
function Router(label,{c=C.teal,lit=0}={}){const top=`M0 -26 L40 -6 L0 14 L-40 -6z`;return `<path d="M-40 -6 L-40 14 L0 34 L40 14 L40 -6 L0 14z" fill="#16494f"/><path d="${top}" fill="${lit?C.mustard:c}"/><path d="M-40 -6 L0 14 L0 34 L-40 14z" fill="#1a575e"/>`+(label?Tx(0,62,label,26,{weight:800}):'')}
function Clock(){return `<circle r="34" fill="${C.paper}" stroke="${C.ink}" stroke-width="5"/><line x1="0" y1="0" x2="0" y2="-22" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="0" x2="16" y2="6" stroke="${C.ink}" stroke-width="5" stroke-linecap="round"/>`}
// --- scene 1: origin ----------------------------------------------------------------------
function s1(t,A,E,sc){let h='';
 const MP=(lon,lat)=>[-450+(lon+125)/16*900,-280+(42-lat)/10*560];
 const phoneOut=kk(t,A[2]-.35,.7);
 if(phoneOut<1){const pin=pop(t,sc.start+.5,.6),px=380-80*phoneOut;
  let ph=`<rect x="-150" y="-260" width="300" height="520" rx="36" fill="#262321" filter="url(#shadow)"/><rect x="-132" y="-226" width="264" height="450" rx="12" fill="#f2efe8"/>`;
  const lo=kk(t,A[1]+.6,.7);
  ['嗨，下課了嗎？','等等吃什麼？','傳個貼圖給你'].forEach((b,i)=>{const q=pop(t,A[0]+.25+i*.45,.4);ph+=G(`<rect x="${i%2?-40:-120}" y="-24" width="${b.length*24+30}" height="48" rx="22" fill="${i%2?'#9fd3a8':'#fff'}" stroke="#cfc8b8"/>`+Tx(i%2?-25:-105,1,b,22,{anchor:'start',weight:600}),{y:-150+i*80,o:q.o*(1-lo),s:q.s})});
  ph+=G(Tx(0,0,'L O',120,{weight:900,fill:C.red,ls:12}),{y:40,o:lo,s:.6+.4*back(clamp((t-A[1]-.6)/.6))});
  ph+=G(Tx(0,0,'網路的第一句話',30,{weight:800}),{y:150,o:lo});
  h+=G(ph,{x:px,y:330,r:-4+3*phoneOut,o:pin.o*(1-phoneOut),s:pin.s,id:'phone'});}
 // newspaper clipping
 const cin=kk(t,A[2]-.2,.8);
 if(cin>0){let c=Paper(560,560,{fill:'#f3ecd9',tapeX:-160});
  c+=Tx(0,-232,'THE  DAILY  NETWORK',22,{weight:700,ls:6,fill:'#6d6250'})+`<line x1="-250" y1="-208" x2="250" y2="-208" stroke="${C.ink}" stroke-width="3"/>`;
  c+=Tx(0,-150,'1969-10-29',78,{weight:900,fill:C.red});
  c+=Tx(0,-72,'ARPANET 第一則訊息',40,{weight:900});
  c+=Tx(0,-20,'UCLA → SRI（晚間 10:30）',28,{weight:700,fill:'#4b4134'});
  for(let i=0;i<4;i++)c+=`<rect x="-240" y="${22+i*30}" width="${i===3?300:480}" height="12" fill="#c9bfa8"/>`;
  const hr=kk(t,A[6],.6);c+=G(G(Clock(),{x:-180})+Tx(-128,0,'約 1 小時後：LOGIN 成功',30,{anchor:'start',weight:800,fill:C.green}),{y:180,o:hr});
  const st=pop(t,A[7]+.2,.4);c+=G(Stamp('美國國防部資助',{size:36}),{x:70,y:105,r:-9,o:st.o,s:st.s*1.0+(1-st.s)*1.6});
  h+=G(c,{x:335+40*(1-cin),y:322,r:-3,o:cin,id:'clipping'});}
 // map card
 const min=kk(t,A[2]+.25,.8);
 if(min>0){let m=Paper(980,580,{fill:'#efe7d3',tapeX:300});
  m+=`<rect x="-490" y="-290" width="980" height="580" fill="url(#lines)" opacity=".5"/>`;
  const coast=[[-124.2,42],[-124.1,40.4],[-123.8,39.3],[-123,38.3],[-122.5,37.8],[-122.4,37.2],[-121.9,36.6],[-121.3,35.7],[-120.6,34.9],[-120.4,34.45],[-119.2,34.15],[-118.5,34],[-118.2,33.75],[-117.3,33],[-117.1,32.3]].map(p=>MP(...p));
  m+=`<path d="M-490 -290 L${coast.map(p=>p.join(' ')).join(' L')} L-490 290 Z" fill="${C.sea}" opacity=".75"/>`;
  m+=`<polyline points="${coast.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${C.ink}" stroke-width="3"/>`;
  m+=Tx(-400,140,'太平洋',30,{fill:'#3e5d63',weight:800,ls:6})+Tx(40,-170,'加州',34,{fill:'#8a7a5c',weight:900,ls:8})+Tx(330,-90,'猶他',34,{fill:'#8a7a5c',weight:900,ls:8});
  const [ux,uy]=MP(-118.44,34.07),[sx,sy]=MP(-122.18,37.45),[bx,by]=MP(-119.85,34.41),[tx,ty]=MP(-111.89,40.76);
  // 1969 year-end links
  const net=kk(t,A[9]+.3,1.2);
  if(net>0){[[ux,uy,bx,by],[bx,by,sx,sy],[sx,sy,tx,ty]].forEach((l,i)=>{m+=Line(...l,clamp(net*1.5-i*.25),{stroke:C.teal,w:6})})}
  const lp=kk(t,A[4]+.1,.9);m+=Line(ux,uy-36,sx,sy-36,lp,{stroke:C.ink,w:5,dash:'14 10'});
  const crash=A[5]+(E[5]-A[5])*.5;
  ['L','O','G'].forEach((ch,i)=>{const st=A[4]+1.1+i*.75;let p=clamp((t-st)/1.5);if(i===2)p=Math.min(p,.42);if(t<st)return;
   const [x,y]=[lerp(ux,sx,ease(p)),lerp(uy,sy,ease(p))-36];const arrived=p>=1;
   const lx=arrived?sx+38+i*44:x,ly=arrived?sy-112:y-52;
   m+=G(`<rect x="-24" y="-26" width="48" height="52" fill="${i===2&&t>crash?'#e9b7ae':C.paper}" stroke="${C.ink}" stroke-width="3"/>`+Tx(0,1,ch,34,{weight:900,fill:i===2&&t>crash?C.red:C.ink}),{x:lx,y:ly})});
  if(t>crash){const q=pop(t,crash,.35);const sh=t<crash+.6?Math.sin((t-crash)*70)*6*(1-(t-crash)/.6):0;
   const mx=lerp(ux,sx,.42),my=lerp(uy,sy,.42)-36;
   m+=G(`<path d="M-30 -30 L30 30 M30 -30 L-30 30" stroke="${C.red}" stroke-width="12" stroke-linecap="round"/>`,{x:mx+sh,y:my,o:q.o,s:q.s});
   m+=G(Stamp('當機！',{size:40}),{x:mx+190+sh,y:my-70,r:-8,o:q.o,s:q.s})}
  const p1=pop(t,A[3]+.1),p2=pop(t,A[4]+.1);
  m+=G(Pin('UCLA','加州大學洛杉磯分校'),{x:ux,y:uy,o:p1.o,s:p1.s});
  m+=G(Pin('SRI','史丹佛研究院',{anchor:'end'}),{x:sx,y:sy,o:p2.o,s:p2.s});
  const p3=pop(t,A[9]+.1),p4=pop(t,A[9]+.5);
  m+=G(Pin('UCSB','',{color:C.teal,anchor:'end',dx:22}),{x:bx,y:by+90,o:p3.o,s:p3.s});
  if(p3.o>0)m+=Line(bx,by+90-4,bx,by,1,{stroke:C.teal,w:3,dash:'4 6'});
  m+=G(Pin('猶他大學','',{color:C.teal}),{x:tx,y:ty,o:p4.o,s:p4.s});
  const mf=kk(t,A[8]+.2,.6);
  if(mf>0)[[ux+72,uy+60],[sx-40,sy+60]].forEach(([x,y])=>{m+=G(`<rect x="-26" y="-40" width="52" height="80" fill="#4a4740" stroke="${C.ink}" stroke-width="3"/><circle cx="-8" cy="-20" r="7" fill="${C.paper}"/><circle cx="10" cy="-20" r="7" fill="${C.paper}"/><rect x="-16" y="2" width="32" height="5" fill="${C.mustard}"/><rect x="-16" y="14" width="32" height="5" fill="${C.mustard}"/>`,{x,y,o:mf})});
  const tag=pop(t,A[9]+1.2);m+=G(`<rect x="-200" y="-34" width="400" height="68" fill="${C.teal}"/>`+Tx(0,2,'1969 年底：4 台主機相連',30,{fill:'#fff',weight:800}),{x:220,y:240,o:tag.o,s:tag.s});
  h+=G(m,{x:1200+12*(1-min),y:334,r:1.2,o:min,id:'map'});}
 return h}
// --- scene 2: principle (core shot) ------------------------------------------------------
const NET={S:[690,330],A:[930,170],B:[930,490],F:[1210,105],C:[1210,330],E:[1210,560],D:[1470,330]};
const EDGES=[['S','A'],['S','B'],['A','F'],['F','D'],['A','C'],['B','C'],['C','D'],['B','E'],['E','D']];
function s2(t,A,E,sc){let h='';const N=NET;
 // left comparison card that changes role
 const cin=kk(t,sc.start+.3,.7),role2=kk(t,A[7]-.1,.6),role3=kk(t,A[11]+.2,.6);
 let c=Paper(500,580,{fill:'#f3ecd9',tapeX:-120});
 const r1o=1-role2;

const SCENES={s1,s2,s3,s4,s5};
// --- player core ----------------------------------------------------------------------------
function scale(){if(!project)return;const cs=getComputedStyle($('shell')),inner=$('shell').clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);const s=exporting?1:Math.min(1,inner/project.width);$('stage').style.transform='scale('+s+')';$('viewport').style.width=project.width*s+'px';$('viewport').style.height=project.height*s+'px'}
function scenes(){return project.variants[locale].scenes}
function currentScene(t){return scenes().find(s=>t>=s.start&&t<s.end)||scenes().at(-1)}

 const local=t-sc.start,out=clamp((sc.end-t)/.45),inn=kk(t,sc.start,.5);
 $('eyebrow').textContent=credit?'':CH[idx]||'';$('heading').textContent=sc.title||'';$('subheading').textContent=sc.screen||'';
 for(const id of ['eyebrow','heading','subheading','visual'])$(id).style.display=credit?'none':'block';

 $('heading').style.opacity=inn;$('heading').style.transform=`translateY(${-(1-inn)*14}px)`;$('subheading').style.opacity=kk(t,sc.start+.25,.5);
 $('visual').style.opacity=out;

 $('caption').style.display=cue&&captionOn&&!credit?'flex':'none';$('caption1').textContent=cue?.text['zh-TW']||'';$('caption2').textContent=cue?.text[subs]||'';$('caption2').lang=subs;
 $('progress-mark').style.width=100*t/project.duration+'%';$('seek').value=frame;$('time').textContent=fmt(t)+' / '+fmt(project.duration);$('chapters').value=sc.start}
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
async function seekToFrame(n,language=locale){if(!project.variants[language])throw Error('Unknown locale');if(language!==locale){locale=language;$('locale').value=locale;chapters();setAudio()}frame=Math.max(0,Math.min(Math.round(project.duration*project.fps)-1,Math.round(n)));draw();if(!exporting&&audioReady&&Math.abs(audio.currentTime-frame/project.fps)>.15)audio.currentTime=frame/project.fps;return frame}

// --- interactive lab: break links, then route a packet (BFS) --------------------------------
const LN={S:[90,190],A:[300,80],B:[300,300],F:[560,50],C:[560,190],E:[560,330],D:[800,190]};
let LE=EDGES.map(([a,b])=>({a,b,broken:false,backup:false})),labPath=null,labAnim=0;
function labDraw(){const svg=$('lab');let s='';
 LE.forEach((e,i)=>{const [x1,y1]=LN[e.a],[x2,y2]=LN[e.b];const on=labPath&&labPath.some((n,k)=>k&&((labPath[k-1]===e.a&&n===e.b)||(labPath[k-1]===e.b&&n===e.a)));

 Object.entries(LN).forEach(([k,[x,y]])=>{s+=`<circle cx="${x}" cy="${y}" r="24" fill="${k==='S'||k==='D'?'#c4432f':'#1d6b73'}"/><text x="${x}" y="${y+48}" font-size="20" text-anchor="middle" font-weight="800" fill="#2a2622">${k==='S'?'起點':k==='D'?'終點':k}</text>`});

 svg.innerHTML=s;svg.querySelectorAll('.edge').forEach(g=>{const fn=()=>{const e=LE[g.dataset.i];e.broken=!e.broken;labPath=null;labAnim=0;$('feedback').textContent=`${e.a}–${e.b} 線路${e.broken?'已斷線':'已修復'}。按「送出封包」看看結果。`;labDraw()};g.onclick=fn;g.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();fn()}}})}
function route(){const adj={};LE.filter(e=>!e.broken).forEach(e=>{(adj[e.a]??=[]).push(e.b);(adj[e.b]??=[]).push(e.a)});const prev={S:null},q=['S'];while(q.length){const n=q.shift();if(n==='D')break;for(const m of adj[n]||[])if(!(m in prev)){prev[m]=n;q.push(m)}}if(!('D' in prev))return null;const p=[];for(let n='D';n;n=prev[n])p.unshift(n);return p}
$('send').onclick=()=>{labPath=route();const fb=$('feedback');if(!labPath){labAnim=0;fb.textContent='無路可走！所有通往終點的線都斷了：這就像馬祖兩條海纜同時斷裂，需要另一條備援線路（微波、衛星）才能恢復通訊。';labDraw();return}
 const broken=LE.filter(e=>e.broken).length;fb.textContent=`封包抵達！路線：${labPath.map(k=>k==='S'?'起點':k==='D'?'終點':k).join(' → ')}（${labPath.length-1} 段）。`+(broken?`即使有 ${broken} 條線斷了，封包仍能繞道。`:'試著切斷幾條線再送一次。');
 const t0=performance.now();const step=now=>{labAnim=Math.min(1,(now-t0)/1400);labDraw();if(labAnim<1)requestAnimationFrame(step)};requestAnimationFrame(step)};
$('isolate').onclick=()=>{LE.forEach(e=>{if(!e.backup&&(e.b==='D'||e.a==='D'))e.broken=true});labPath=null;labAnim=0;$('feedback').textContent='已切斷所有通往終點的地面線路（像馬祖的兩條海纜都斷了）。按「送出封包」看看會怎樣？';labDraw()};
$('addbackup').onclick=()=>{if(!LE.some(e=>e.backup))LE.push({a:'A',b:'D',broken:false,backup:true});labPath=null;labAnim=0;$('feedback').textContent='加上了一條衛星備援線（藍色虛線，A → 終點）。再送一次封包試試。';labDraw()};
$('resetlab').onclick=()=>{LE=EDGES.map(([a,b])=>({a,b,broken:false,backup:false}));labPath=null;labAnim=0;$('feedback').textContent='所有線路正常。按「送出封包」試試看。';labDraw()};
